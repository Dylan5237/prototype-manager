<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760">
  <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .section { font-size: 11px; font-weight: 700; letter-spacing: .08em; fill: #6b7280; }
    .node-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 12px; fill: #6b7280; }
    .node-code { font-size: 12px; fill: #1d4ed8; font-family: Consolas, monospace; }
    .label { font-size: 12px; font-weight: 600; fill: #374151; }
    .note { font-size: 12px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="52" y="55" class="title">提示词变量引用手册：两阶段交付路径</text>
  <text x="52" y="82" class="subtitle">管理端发布一份手册；接入前通过提示词快照保证可用，接入后通过 MCP 工具读取最新版本</text>

  <rect x="42" y="112" width="1316" height="182" rx="12" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="62" y="138" class="section">内容维护与提示词生成</text>

  <rect x="70" y="165" width="250" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="94" y="195" class="node-title">帮助中心 / 管理维护</text>
  <text x="94" y="218" class="node-sub">编辑 Markdown · 保存草稿 · 发布版本</text>
  <text x="94" y="239" class="node-code">quick-start · v1.0</text>

  <rect x="410" y="165" width="250" height="88" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="434" y="195" class="node-title">Help API</text>
  <text x="434" y="218" class="node-sub">鉴权、发布状态、版本和缓存</text>
  <text x="434" y="239" class="node-code">GET /api/help-docs/:slug</text>

  <path d="M 744,174 C 770,160 810,160 834,174 L 834,244 C 810,258 770,258 744,244 Z" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <ellipse cx="789" cy="174" rx="45" ry="13" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="789" y="208" text-anchor="middle" class="node-title">Published Docs</text>
  <text x="789" y="230" text-anchor="middle" class="node-sub">help_documents</text>
  <ellipse cx="789" cy="244" rx="45" ry="13" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>

  <rect x="960" y="165" width="330" height="88" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="984" y="195" class="node-title">Prompt Template Service</text>
  <text x="984" y="218" class="node-sub">在服务端解析变量，不交给 AI 猜变量</text>
  <text x="984" y="239" class="node-code">{{quickStartGuide}} + {{helpVersion}}</text>

  <path d="M 320,209 H 410" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="336" y="199" class="label">维护 / 发布</text>
  <path d="M 660,209 H 744" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <text x="674" y="199" class="label">写入发布版</text>
  <path d="M 834,184 H 960" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="851" y="174" class="label">读取最新手册</text>

  <rect x="42" y="330" width="1316" height="328" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="62" y="356" class="section">AI 助手侧：接入前与接入后的实际展示</text>

  <rect x="76" y="408" width="270" height="124" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="100" y="438" class="node-title">平台生成接入提示词</text>
  <text x="100" y="461" class="node-sub">GET /agent-bootstrap</text>
  <text x="100" y="484" class="node-code">quickStartGuide = 已发布快照</text>
  <text x="100" y="507" class="node-sub">复制到当前 AI 会话</text>

  <rect x="476" y="396" width="310" height="148" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="501" y="430" class="node-title">AI 助手 · 接入中</text>
  <text x="501" y="455" class="node-sub">按提示词执行安装、验证、重载</text>
  <rect x="501" y="474" width="258" height="43" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="517" y="501" class="node-code">接入成功后展示 quickStartGuide</text>

  <rect x="916" y="396" width="310" height="148" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.8"/>
  <text x="941" y="430" class="node-title">AI 助手 · 新会话</text>
  <text x="941" y="455" class="node-sub">需要最新手册时调用 MCP 工具</text>
  <rect x="941" y="474" width="258" height="43" rx="7" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="957" y="501" class="node-code">get_help({ slug: "quick-start" })</text>

  <rect x="112" y="570" width="290" height="55" rx="9" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="135" y="594" class="node-title" style="font-size:14px">MCP Server</text>
  <text x="135" y="614" class="node-sub">鉴权后读取 Help API</text>

  <rect x="510" y="570" width="255" height="55" rx="9" fill="#f0fdf4" stroke="#86efac"/>
  <text x="533" y="594" class="node-title" style="font-size:14px">帮助工具结果</text>
  <text x="533" y="614" class="node-sub">正文 + version + updatedAt</text>

  <path d="M 346,470 H 476" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <text x="361" y="460" class="label">完整提示词</text>
  <path d="M 786,470 H 916" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="805" y="460" class="label">重载后新会话</text>
  <path d="M 1071,544 V 560 H 257 V 570" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="900" y="551" class="label">get_help</text>
  <path d="M 257,570 V 300 H 535 V 253" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="280" y="290" class="label">读取已发布版</text>
  <path d="M 660,209 C 742,288 704,420 638,570" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="713" y="360" class="label">正文 + 版本</text>
  <path d="M 765,598 C 830,598 850,500 916,500" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="816" y="557" class="label">AI 展示结果</text>

  <rect x="64" y="690" width="1272" height="40" rx="8" fill="#f8fafc"/>
  <line x1="84" y1="710" x2="118" y2="710" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="127" y="714" class="note">接入前：提示词内嵌快照，保证首次回答可直接展示</text>
  <line x1="550" y1="710" x2="584" y2="710" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="593" y="714" class="note">内容流：只读取已发布版本，不读取草稿</text>
  <line x1="1010" y1="710" x2="1044" y2="710" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="1053" y="714" class="note">动态路径：新会话可随时获取最新手册</text>
</svg>
